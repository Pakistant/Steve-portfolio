<footer class="footer">
  <div class="shell footer__row">
    <div class="footer__brand">
      <app-ring [size]="22" [progress]="72" />
      <span>Steve Tikemene Douanla</span>
    </div>

    <nav class="footer__socials" aria-label="Reseaux sociaux">
      @for (social of socials; track social.label) {
        <a [href]="social.href" target="_blank" rel="noopener" [attr.aria-label]="social.label">
          <app-icon [name]="social.icon" [size]="18" />
        </a>
      }
    </nav>

    <p class="footer__note">Developpe avec Angular — Douala, Cameroun — {{ year }}</p>
  </div>
</footer>

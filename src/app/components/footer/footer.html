<footer class="footer">
  <div class="shell footer__inner">
    <div class="footer__top">
      <div class="footer__brand">
        <img class="footer__logo" src="assets/image/logo.png" alt="Logo Steve Tikemene Douanla" width="42" height="42" loading="lazy" decoding="async" />

        <div class="footer__identity">
          <p>Développeur Web &amp; Webmaster</p>
          <p class="footer__tagline">Je transforme vos idées en expériences web modernes.</p>
        </div>
      </div>

      <nav class="footer__nav" aria-label="Navigation du pied de page">
        @for (link of links; track link.label) {
          <a [href]="link.href">{{ link.label }}</a>
        }
      </nav>

      <div class="footer__meta">
        <p>Douala, Cameroun</p>
        <a href="mailto:stdouanla@gmail.com">stdouanla@gmail.com</a>
      </div>
    </div>

    <div class="footer__bottom">
      <p>© {{ year }} Tikemene Douanla Steve</p>
      <p>Tous droits réservés.</p>
    </div>
  </div>
</footer>

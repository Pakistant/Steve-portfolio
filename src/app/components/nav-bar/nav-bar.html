<header class="nav" [class.nav--scrolled]="scrolled()">
  <div class="nav__shell shell">
    <a class="nav__brand" href="#top">
      <img class="nav__logo" src="assets/image/logo.png" alt="" />
      <span>
        Steve<em>.</em>Douanla
      </span>
    </a>

    <nav class="nav__links" aria-label="Navigation principale">
      @for (link of links; track link.href) {
        <a
          [href]="'#' + link.href"
          class="nav__link"
          [class.nav__link--active]="active() === link.href"
        >{{ link.label }}</a>
      }
    </nav>

    <a class="btn btn--primary nav__cta" href="#contact">
      Disponible pour une mission
      <app-icon name="arrow" [size]="16" />
    </a>

    <button
      class="nav__toggle"
      type="button"
      (click)="toggle()"
      [attr.aria-expanded]="open()"
      aria-controls="mobile-menu"
      aria-label="Ouvrir le menu"
    >
      <app-icon [name]="open() ? 'close' : 'menu'" [size]="22" />
    </button>
  </div>

  @if (open()) {
    <button class="nav__backdrop" type="button" aria-label="Fermer le menu" (click)="close()"></button>
  }

  <nav
    id="mobile-menu"
    class="nav__mobile"
    [class.nav__mobile--open]="open()"
    [attr.aria-hidden]="!open()"
    aria-label="Navigation mobile"
  >
    @for (link of links; track link.href) {
      <a [href]="'#' + link.href" (click)="close()">
        <app-icon [name]="link.icon" [size]="19" />
        <span>{{ link.label }}</span>
      </a>
    }
  </nav>
</header>
